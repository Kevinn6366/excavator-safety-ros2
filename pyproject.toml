[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excavator-safety"
version = "0.1.0"
description = "RGB-D perception and path-aware AEB simulation for ROS 2 and Gazebo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/Kevinn6366/excavator-safety-ros2"
Issues = "https://github.com/Kevinn6366/excavator-safety-ros2/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.black]
line-length = 88
target-version = ["py312"]
