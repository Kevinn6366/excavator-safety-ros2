<script>
const $=id=>document.getElementById(id),names={front:'前方',rear:'后方',left:'左侧',right:'右侧'},sides=Object.keys(names);let state=null,token='',polling=false,posting=false,view='rgb',seq={},birdSeq=0,driveSending=false,pending=null,driving=false,sliderTimer,toastTimer,lastReset=0,audioCtx=null,sound=true,lastAeb=false,lastBeep=0,lastGood=0;
const panes={bird:$('birdPane'),cameras:$('cameraPane'),perception:$('perceptionPane'),settings:$('settingsPane')},labels={bird:'360° 环视',cameras:'四路相机',perception:'周边感知',settings:'场景设置'};let choices=['bird','cameras'];try{const saved=JSON.parse(localStorage.getItem('zx200_panes'));if(saved?.length===2&&saved.every(x=>panes[x])&&saved[0]!==saved[1])choices=saved}catch{}
function arrange(){Object.values(panes).forEach(p=>$('store').append(p));choices.forEach((p,i)=>{$(i?'rightSlot':'leftSlot').append(panes[p]);$(i?'rightSelect':'leftSelect').value=p});localStorage.setItem('zx200_panes',JSON.stringify(choices))}
['leftSelect','rightSelect'].forEach((id,i)=>{Object.entries(labels).forEach(([v,l])=>$(id).add(new Option(l,v)));$(id).onchange=()=>{const next=$(id).value;if(choices[1-i]===next)choices[1-i]=choices[i];choices[i]=next;arrange()}});arrange();
$('settingsBtn').onclick=()=>{if(choices.includes('settings')){choices[choices.indexOf('settings')]='cameras';if(choices[0]===choices[1])choices[0]='bird'}else choices[1]='settings';arrange()};
for(const side of sides){const card=document.createElement('article');card.className='camera';card.innerHTML=`<img id="cam-${side}" alt="${names[side]}实时相机"><span class="camera-title">${names[side]}</span><span class="cam-time" id="time-${side}"></span><div class="offline-cover" id="off-${side}">等待影像</div>`;$('cameras').append(card)}
function setView(v){view=v;seq={};$('rgbMode').classList.toggle('active',v==='rgb');$('depthMode').classList.toggle('active',v==='depth');poll()};$('rgbMode').onclick=()=>setView('rgb');$('depthMode').onclick=()=>setView('depth');
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}
function unlockAudio(){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch{}}
function beep(){if(!sound||!audioCtx||audioCtx.state!=='running')return;const t=audioCtx.currentTime;for(let i=0;i<2;i++){const oscillator=audioCtx.createOscillator(),gain=audioCtx.createGain();oscillator.frequency.value=760;gain.gain.setValueAtTime(.0001,t+i*.22);gain.gain.exponentialRampToValueAtTime(.12,t+i*.22+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+i*.22+.16);oscillator.connect(gain);gain.connect(audioCtx.destination);oscillator.start(t+i*.22);oscillator.stop(t+i*.22+.17)}}
$('soundBtn').onclick=()=>{unlockAudio();sound=!sound;$('soundBtn').setAttribute('aria-pressed',sound);$('soundLabel').textContent=sound?'提示音':'已静音';if(sound)beep()};
async function api(path,payload){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Local-Control':token},body:JSON.stringify(payload),signal:AbortSignal.timeout(5000)});if(!r.ok){let d;try{d=await r.json()}catch{}throw Error(d?.error||'请求失败，请检查连接')}return r.json()}
async function action(action){if(posting||!token)return;const people=Number($('people').value),obstacles=Number($('obstacles').value);if(![people,obstacles].every(x=>Number.isInteger(x)&&x>=0&&x<=40)){toast('人员和障碍物数量须为 0–40 的整数');return}releaseControls();posting=true;unlockAudio();try{const d=await api('/api/action',{action,people,obstacles});$('job').textContent=d.job.message;if(action!=='start')driving=false}catch(e){toast(e.message)}finally{posting=false;poll()}}
for(const id of ['start','stop','reset'])$(id).onclick=()=>action(id);$('random').onclick=()=>action('randomize');
// Inputs describe desired motion only. ROS owns signed acceleration and AEB.
let cruise=0,pointerTurn=0,brakeHeld=false,inputOwner=false,keys=new Set(),motionBusy=false,motionPending=null;
function canDrive(){return state&&Date.now()-lastGood<1500&&state.status?.healthy&&state.status_age<1.5&&state.simulation.running&&state.simulation.job.state!=='running'&&!posting}
function desired(){const limit=Number($('speedSlider').value)/3.6,ws=keys.has('KeyW')||keys.has('KeyS');return {speed:ws?((keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0))*limit:cruise*limit,yaw:((keys.has('KeyA')?1:0)-(keys.has('KeyD')?1:0)+pointerTurn)*.55,brake:brakeHeld}}
async function sendMotion(){let m=desired();m.yaw=Math.max(-.55,Math.min(.55,m.yaw));if(!canDrive())m={speed:0,yaw:0,brake:true};motionPending=m;if(motionBusy||!token)return;motionBusy=true;while(motionPending){const next=motionPending;motionPending=null;try{await api('/api/teleop',next)}catch(e){cruise=0;keys.clear();pointerTurn=0;motionPending=null;if(document.visibilityState==='visible')toast(e.message)}}motionBusy=false}
function releaseControls(){inputOwner=true;brakeHeld=true;cruise=0;pointerTurn=0;keys.clear();sendMotion()}
function buttonDrive(direction){if(!canDrive())return;unlockAudio();inputOwner=true;brakeHeld=false;keys.clear();cruise=direction;sendMotion()}
$('forward').onclick=()=>buttonDrive(1);$('reverse').onclick=()=>buttonDrive(-1);$('park').onclick=releaseControls;
for(const[id,dir]of [['turnLeft',1],['turnRight',-1]]){const el=$(id);el.onpointerdown=e=>{if(!canDrive())return;e.preventDefault();el.setPointerCapture(e.pointerId);unlockAudio();inputOwner=true;brakeHeld=false;pointerTurn=dir;sendMotion()};const release=()=>{if(pointerTurn===dir){pointerTurn=0;sendMotion()}};el.onpointerup=release;el.onpointercancel=release;el.onlostpointercapture=release}
function editing(target){return target instanceof Element&&!!target.closest('textarea,select,[contenteditable="true"],input:not([type="range"])')}
window.addEventListener('keydown',e=>{if(!['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)||editing(e.target)||e.altKey||e.metaKey||e.ctrlKey)return;e.preventDefault();if(e.code==='Space'){releaseControls();return}if(!canDrive()||e.repeat)return;unlockAudio();inputOwner=true;brakeHeld=false;if(e.code==='KeyW'||e.code==='KeyS')cruise=0;keys.add(e.code);sendMotion()});
window.addEventListener('keyup',e=>{if(keys.delete(e.code)){e.preventDefault();sendMotion()}});
window.addEventListener('blur',()=>{if(inputOwner)releaseControls()});window.addEventListener('pagehide',()=>{if(inputOwner)releaseControls()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&inputOwner)releaseControls()});
setInterval(()=>{if(inputOwner&&(cruise||pointerTurn||keys.size||Math.abs(state?.status?.measured_speed||0)>.005||Math.abs(state?.status?.measured_yaw||0)>.005))sendMotion()},100);
$('speedSlider').oninput=()=>{$('speedValue').textContent=Number($('speedSlider').value).toFixed(1)+' km/h';if(cruise||keys.size)sendMotion()};
function svg(tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el}
function perception(d,fresh){$('scanPoints').replaceChildren();$('targets').replaceChildren();const items=[];let count=0;if(fresh){for(const v of Object.values(d.visual_scan||{})){if(v.age>1.2||Math.abs(v.stamp-d.status.stamp)>.8)continue;for(const p of v.points){if(Math.hypot(p[0],p[1])>11)continue;$('scanPoints').append(svg('circle',{cx:300-p[1]*25,cy:300-p[0]*25,r:1.8}));count++}}for(const v of Object.values(d.detections||{})){if(v.age>1.2||Math.abs(v.stamp-d.status.stamp)>.8)continue;for(const t of v.targets){if(items.some(o=>o.label===t.label&&Math.hypot(o.position[0]-t.position[0],o.position[1]-t.position[1])<.9))continue;items.push(t)}}}
for(const t of items){if(Math.hypot(...t.position.slice(0,2))>11)continue;const g=svg('g',{transform:`translate(${300-t.position[1]*25},${300-t.position[0]*25})`}),color=t.distance<3?'#c3312c':'#657b69';if(t.label==='person'){g.append(svg('circle',{cx:0,cy:-7,r:3,fill:color}));g.append(svg('path',{d:'M0 -2v9m-5-7 5-2 5 2M0 7l-4 7m4-7 4 7',stroke:color,'stroke-width':2,fill:'none'}))}else g.append(svg('rect',{x:-7,y:-7,width:14,height:14,rx:2,fill:color}));const text=svg('text',{x:0,y:27,'text-anchor':'middle',fill:'#4e5c4d','font-size':11});text.textContent=t.distance.toFixed(1)+' m';g.append(text);$('targets').append(g)}$('targetCount').textContent=items.length+' 个目标';$('scanMeta').textContent='' ;}
function offline(){document.body.classList.remove('status-idle');state=null;driving=false;inputOwner=false;cruise=0;keys.clear();pointerTurn=0;$('connection').textContent='连接中断';$('connection').className='';$('statusStrip').className='status-strip fault';$('statusTitle').textContent='连接中断';$('statusDetail').textContent='';$('forward').disabled=true;$('reverse').disabled=true;$('turnLeft').disabled=true;$('turnRight').disabled=true;$('speed').textContent='—';$('birdOffline').hidden=false;sides.forEach(s=>$('off-'+s).hidden=false);perception({},false)}
function render(d){const x=d.status||{},fresh=d.status&&d.status_age<1.5,sim=d.simulation,busy=posting||sim.job.state==='running',ready=fresh&&x.healthy&&sim.running&&!busy;state=d;lastGood=Date.now();token=d.control_token;if(!driveSending)driving=!!ready&&Math.abs(x.requested)>0;
$('connection').textContent=sim.running?'在线':'已停止';$('connection').className='connected';$('travel').textContent='行驶 '+d.travel_m.toFixed(0)+' m';$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Shanghai'});
const aeb=!!(fresh&&x.aeb_active),collision=!!(fresh&&x.collision_recent),alertActive=aeb||collision;$('statusStrip').className='status-strip'+(alertActive?' braking':!fresh||!x.healthy?' fault':x.state!=='SAFE'?' warning':'');$('statusIcon').setAttribute('href',alertActive?'#brake':'#shield');
$('statusTitle').textContent=collision?'碰撞警告':aeb?'AEB 紧急刹车已触发':!fresh?(sim.running?'连接中':'未启动'):!x.healthy?'感知异常':x.brake?'制动':x.state==='WARNING'?'已限速':x.state==='NOTICE'?'注意障碍':'AEB 就绪';
$('statusDetail').textContent='';
document.body.classList.toggle('status-idle',!!(fresh&&x.healthy&&!alertActive&&x.state==='SAFE'));
if(alertActive&&(!lastAeb||Date.now()-lastBeep>4000)){beep();lastBeep=Date.now()}lastAeb=alertActive;
$('speed').textContent=fresh?(Math.abs(x.measured_speed)*3.6).toFixed(1):'—';$('speedMetric').textContent=fresh?'· '+Math.abs(x.measured_speed).toFixed(2)+' m/s':'';$('gear').textContent=fresh?(x.measured_speed<-.03||x.requested<0?'R':x.measured_speed>.03||x.requested>0?'D':Math.abs(x.requested_yaw||0)>.01||Math.abs(x.command_yaw||0)>.01?'N':'P'):'P';$('gear').className='gear'+(fresh&&(Math.abs(x.requested)>0||Math.abs(x.command_yaw||0)>.01)?' moving':'');$('forward').disabled=!ready;$('forward').classList.toggle('active',driving&&x.requested>0);$('reverse').disabled=!ready;$('reverse').classList.toggle('active',driving&&x.requested<0);for(const id of ['turnLeft','turnRight'])$(id).disabled=!ready;$('turnLeft').classList.toggle('held',keys.has('KeyA')||pointerTurn>0);$('turnRight').classList.toggle('held',keys.has('KeyD')||pointerTurn<0);$('turnValue').textContent=fresh&&Math.abs(x.measured_yaw||0)>.01?((x.measured_yaw>0?'左转 ':'右转 ')+Math.abs(x.measured_yaw*180/Math.PI).toFixed(0)+'°/s'):'—';if(!ready){inputOwner=false;cruise=0;keys.clear();pointerTurn=0;}if(inputOwner&&!cruise&&!keys.size&&!pointerTurn&&Math.abs(x.measured_speed||0)<.005&&Math.abs(x.measured_yaw||0)<.005&&!motionBusy)inputOwner=false;$('park').disabled=!token;
$('clearance').textContent=fresh?(x.distance>=90?'未检出':x.distance.toFixed(2)+' m'):'—';$('threshold').textContent=fresh?(x.brake_threshold+.15).toFixed(2)+' m':'—';
$('start').disabled=busy||sim.running;$('stop').disabled=busy||!sim.running;$('reset').disabled=busy;$('random').disabled=busy||!ready;$('people').disabled=busy;$('obstacles').disabled=busy;$('job').textContent=sim.job.message;$('job').className='job'+(sim.job.state==='error'?' error':'');
if(sim.job.action==='reset'&&sim.job.state==='success'&&sim.job.finished!==lastReset){lastReset=sim.job.finished;cruise=0;keys.clear();pointerTurn=0;for(const k of ['people','obstacles'])$(k).value=24;$('speedSlider').value=3.6;$('speedValue').textContent='3.6 km/h'}
let online=0;for(const s of sides){const c=d.cameras[s][view];$('off-'+s).hidden=c.online;if(c.online){online++;if(seq[s]!==c.seq){seq[s]=c.seq;$('cam-'+s).src='/frame/'+s+'.jpg?view='+view+'&seq='+c.seq}}$('time-'+s).textContent=''}$('onlineCount').textContent=online+' / 4 在线';$('cameraTime').textContent='';
const b=d.panorama||{};$('birdOffline').hidden=!!b.online;$('birdMeta').textContent=b.online?'实时':'离线';if(b.online&&birdSeq!==b.seq){birdSeq=b.seq;$('birdImage').src='/frame/birdseye.jpg?seq='+b.seq}perception(d,fresh);
}
async function poll(){if(polling)return;polling=true;try{const r=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(2200)});if(!r.ok)throw Error();render(await r.json())}catch{offline()}finally{polling=false}}
setInterval(poll,350);setInterval(()=>{if(lastGood&&Date.now()-lastGood>2500)offline()},500);poll();
